name: editor

on:
  push:
    branches: [master]
  pull_request:
    paths: ["editor/**", "engine/src/Patina.Server/openapi.json", ".github/workflows/editor.yml"]
  # release.yml runs these jobs on the tagged commit and publishes only when they pass.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: editor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the Server's OpenAPI document
        run: pnpm exec nx run api-client:check-generated
      - name: Type-check (strict, templates included)
        run: pnpm exec nx run-many -t typecheck
      - name: Lint (type-aware, warnings fail)
        run: pnpm exec nx run-many -t lint
      - run: pnpm exec nx run-many -t test
      - run: pnpm exec nx build desktop

  # The real desktop app: Electron, the production studio build and the two sidecars.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dotnet
      - name: Build the engine
        working-directory: engine
        run: dotnet build Patina.slnx -c Release
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx build desktop
      - name: Playwright (Electron)
        run: xvfb-run --auto-servernum pnpm exec playwright test --config apps/desktop/e2e/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: editor/dist/e2e-*
