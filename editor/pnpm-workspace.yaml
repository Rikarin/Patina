allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  # electron-builder's Squirrel.Windows installer; Patina builds NSIS installers, so its download is not needed.
  electron-winstaller: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@xui/button@3.1.0'
  - '@xui/core@3.1.0'
  - '@xui/dock-manager@3.1.0'
  - '@xui/icon@3.1.0'
