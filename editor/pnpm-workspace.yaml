allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  electron: true
  # electron-builder's Squirrel.Windows installer; Patina builds NSIS installers, so its download is not needed.
  electron-winstaller: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@xui/button@3.1.0'
  - '@xui/callout@3.1.0'
  - '@xui/color-picker@3.1.0'
  - '@xui/core@3.1.0'
  - '@xui/descriptions@3.1.0'
  - '@xui/dialog@3.1.0'
  - '@xui/dock-manager@3.1.0'
  - '@xui/form-field@3.1.0'
  - '@xui/icon@3.1.0'
  - '@xui/input@3.1.0'
  - '@xui/label@3.1.0'
  - '@xui/multi-select@3.1.0'
  - '@xui/node-graph@3.1.0'
  - '@xui/non-ideal-state@3.1.0'
  - '@xui/numeric-input@3.1.0'
  - '@xui/omnibar@3.1.0'
  - '@xui/popover@3.1.0'
  - '@xui/segmented-control@3.1.0'
  - '@xui/select@3.1.0'
  - '@xui/skeleton@3.1.0'
  - '@xui/slider@3.1.0'
  - '@xui/spinner@3.1.0'
  - '@xui/switch@3.1.0'
  - '@xui/tag-input@3.1.0'
  - '@xui/tag@3.1.0'
