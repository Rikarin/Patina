# glTF 2.0: the core metallic-roughness material, with a .gltf beside the images that names them. See
# docs/adr/0019-export-presets.md.
version: 1
id: gltf
name: glTF 2.0
engine: glTF
# "The normal vectors use the convention +X is right and +Y is up" (glTF 2.0, 3.9.3).
normal: y-up
padding: infinite
materials: [gltf]
textures:
  # Base colour is sRGB, with alpha in the fourth lane.
  - file: "{set}_baseColor"
    format: png8
    space: srgb
    channels: [baseColor.r, baseColor.g, baseColor.b, opacity.r]
  - file: "{set}_normal"
    format: png8
    space: linear
    channels: [normal.r, normal.g, normal.b]
  # Occlusion in red, roughness in green and metallic in blue, which is how glTF reads one file for all three.
  - file: "{set}_occlusionRoughnessMetallic"
    format: png8
    space: linear
    channels: [occlusion.r, roughness.r, metalness.r]
  - file: "{set}_emissive"
    format: png8
    space: srgb
    channels: [emissive.r, emissive.g, emissive.b]
  # OpenPBR's coat, sheen and transmission (#142), written only for a set that has them, in the lanes glTF's
  # KHR_materials_clearcoat, _sheen and _transmission read: the coat in red and its roughness in green, the coat's own
  # normal, the sheen's colour times its weight with its roughness in alpha, and transmission in red. A layer's roughness
  # or normal without its weight is no layer, and writes no file (#310).
  - file: "{set}_clearcoat"
    format: png8
    space: linear
    channels: [coat.r, coatRoughness.r, 0]
  - file: "{set}_clearcoatNormal"
    format: png8
    space: linear
    channels: [coatNormal.r, coatNormal.g, coatNormal.b]
  - file: "{set}_sheen"
    format: png8
    space: srgb
    channels: [sheenTint.r, sheenTint.g, sheenTint.b, sheenRoughness.r]
  - file: "{set}_transmission"
    format: png8
    space: linear
    channels: [transmission.r]
