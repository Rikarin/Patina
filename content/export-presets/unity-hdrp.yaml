# Unity's High Definition Render Pipeline, Lit shader. See docs/adr/0011-export.md.
version: 1
id: unity-hdrp
name: Unity (HDRP)
engine: Unity
normal: y-up
# Islands grow until every texel is filled, so mips and filtering read the chart and not the background.
padding: infinite
textures:
  - file: "{project}_BaseColor"
    format: png8
    space: srgb
    channels: [baseColor.r, baseColor.g, baseColor.b, opacity.r]
  - file: "{project}_Normal"
    format: png8
    space: linear
    channels: [normal.r, normal.g, normal.b]
  # Red metallic, green occlusion, blue detail mask, alpha smoothness, as the mask map's page says. Linear on import.
  - file: "{project}_MaskMap"
    format: png8
    space: linear
    channels: [metalness.r, occlusion.r, mask.r, 1-roughness.r]
  - file: "{project}_Emission"
    format: exr16
    space: linear
    channels: [emissive.r, emissive.g, emissive.b]
  - file: "{project}_Height"
    format: png16
    space: linear
    channels: [height.r]
