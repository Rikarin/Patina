name: python

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "clients/python/**"
      - "engine/**"
      - "external/**"
      - ".github/workflows/python.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  # A generated client and a Blender-shaped session with no Blender (plan §8). A Windows runner has no Vulkan, so the
  # steps that need a GPU skip there; a bake and a build do not.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dotnet
      - name: Install Vulkan and lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - working-directory: engine
        run: dotnet build Patina.slnx -c Release
      - working-directory: clients/python
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python generate.py --check
          python -m pytest
