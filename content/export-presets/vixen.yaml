# Vixen: KTX2 with full mip chains, in the bits the GPU samples, so a game loads them with no import step.
version: 1
id: vixen
name: Vixen
engine: Vixen
# Vixen's frame takes its bitangent along v, which runs down the image (Vixen.TextureGraph's README, held by a test).
normal: y-down
# Islands grow until every texel is filled, so mips and filtering read the chart and not the background.
padding: infinite
textures:
  - file: "{project}_baseColor"
    format: ktx2
    compression: bc7
    quality: balanced
    space: srgb
    mips: true
    channels: [baseColor.r, baseColor.g, baseColor.b, opacity.r]
  - file: "{project}_normal"
    format: ktx2
    compression: bc5
    space: linear
    mips: true
    channels: [normal.r, normal.g]
  # TexturedOrmSurface reads occlusion from red, roughness from green and metalness from blue.
  - file: "{project}_orm"
    format: ktx2
    compression: bc7
    quality: balanced
    space: linear
    mips: true
    channels: [occlusion.r, roughness.r, metalness.r]
  - file: "{project}_emissive"
    format: ktx2
    compression: bc6h
    quality: balanced
    space: linear
    mips: true
    channels: [emissive.r, emissive.g, emissive.b]
  - file: "{project}_height"
    format: ktx2
    compression: bc4
    space: linear
    mips: true
    channels: [height.r]
