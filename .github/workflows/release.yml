name: release

# A version tag (v1.2.3, or v1.2.3-rc.1 for a prerelease) builds every installer and publishes a GitHub release: a .dmg
# and .zip for Apple Silicon Macs, an NSIS installer for Windows x64 and an AppImage for Linux x64, each with the studio,
# Electron and the engine sidecars. Each builds on its own OS. Running the workflow by hand builds them as workflow
# artifacts without publishing a release.
#
# Nothing is published unless the tagged commit passes the same checks as master: engine.yml and editor.yml run here as
# reusable workflows, the tag must point at a commit on master, and the Vixen pin must be on Vixen's main branch (plan §7).
#
# Signing is optional. Without secrets, macOS builds are signed ad hoc (Gatekeeper asks users to allow them) and Windows
# builds are unsigned. Set CSC_LINK (base64 .p12) and CSC_KEY_PASSWORD to sign, and on macOS APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job may write (it creates the release).
permissions:
  contents: read

env:
  PATINA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # The test gate: the tagged commit's own test workflows. They run beside the builds, and the release waits for both.
  engine:
    uses: ./.github/workflows/engine.yml

  editor:
    uses: ./.github/workflows/editor.yml

  # A release comes from master: a tag on an unmerged branch (or on a commit master has since dropped) is refused.
  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/master and the history to check ancestry against
          submodules: recursive
      - name: The tagged commit is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on master; tag a commit on master"
            exit 1
          fi
      - name: The Vixen pin is on Vixen's main branch
        run: |
          if [ ! -e external/Vixen/.git ]; then
            echo "No Vixen submodule yet: nothing to check."
            exit 0
          fi
          git -C external/Vixen fetch --quiet --unshallow origin || git -C external/Vixen fetch --quiet origin
          if ! git -C external/Vixen merge-base --is-ancestor HEAD origin/master; then
            echo "::error::external/Vixen is pinned to a commit that is not on Vixen's master"
            exit 1
          fi

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-24.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # the Sigstore certificate that signs the provenance attestation
      attestations: write
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dotnet
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: editor/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate, do not let electron-builder pick one up from the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: pnpm dist
      # Hashed here, where they were built: the release job checks what it downloads against these and publishes
      # them as SHA256SUMS. "<sha256>  <name>" per line (Git Bash marks binary mode with "*"; that is dropped).
      - name: Checksums
        shell: bash
        working-directory: editor/dist/release
        env:
          SUMS: SHA256SUMS.desktop-${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage)
          if [ "${#files[@]}" = 0 ]; then echo "::error::no installers in editor/dist/release"; exit 1; fi
          if command -v sha256sum > /dev/null; then hash=(sha256sum); else hash=(shasum -a 256); fi
          "${hash[@]}" -- "${files[@]}" | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' > "$SUMS"
          cat "$SUMS"
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: editor/dist/release/SHA256SUMS.desktop-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            editor/dist/release/*.dmg
            editor/dist/release/*.zip
            editor/dist/release/*.exe
            editor/dist/release/*.AppImage
            editor/dist/release/SHA256SUMS.desktop-${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, editor, tag, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the release
      id-token: write # the Sigstore certificate that signs the attestation of SHA256SUMS
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release
          merge-multiple: true
      # SHA256SUMS is the build jobs' own checksums, merged, after checking that every downloaded file still has the
      # hash it had where it was built, and that nothing without one would be published.
      - name: Checksums
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(SHA256SUMS.*)
          if [ "${#parts[@]}" = 0 ]; then echo "::error::the build jobs left no checksums"; exit 1; fi
          sha256sum --strict --check -- "${parts[@]}"
          cat -- "${parts[@]}" > SHA256SUMS
          rm -- "${parts[@]}"
          listed=$(cut -c67- SHA256SUMS)
          for file in *; do
            if [ "$file" != SHA256SUMS ] && ! grep -Fxq -- "$file" <<< "$listed"; then
              echo "::error::$file has no checksum from the job that built it"
              exit 1
            fi
          done
          cat SHA256SUMS
      # Signed (keyless, Sigstore) provenance for SHA256SUMS too, which vouches for every line in it. The bundle is
      # published beside it for verifying without the attestations API.
      - name: Provenance of SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - name: Keep the attestation bundle beside SHA256SUMS
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" release/SHA256SUMS.sigstore.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$REPO" "${flags[@]}"
